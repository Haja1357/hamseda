<h1>هم‌صدا</h1>
<p>نمایشگر صفحه‌های وب این گوشی قدیمی است و هم‌صدا روی آن درست کار نمی‌کند.</p>
<p>لطفاً برنامهٔ <b>Chrome</b> و برنامهٔ <b>Android System WebView</b> را از کافه‌بازار، مایکت یا Google Play به‌روز کنید و بعد هم‌صدا را دوباره باز کنید.</p>
<p>اگر به‌روز کردن ممکن نشد، هم‌صدا را روی گوشی دیگری نصب کنید.</p>
